plugins {
    id 'io.github.joke.conventional-version'
}

group = 'io.github.joke.lint'

repositories {
    mavenCentral()
}

pluginManager.withPlugin('java-base') {
    pluginManager.apply 'com.diffplug.spotless'
    pluginManager.apply 'net.ltgt.errorprone'
    pluginManager.apply 'pmd'
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Werror', '-parameters', '-Xmaxwarns', '10000', '-Xmaxerrs', '10000']
        options.fork = true
        options.forkOptions.jvmArgs += [
                '--sun-misc-unsafe-memory-access=allow'
        ]
    }
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
    }
}

pluginManager.withPlugin('com.diffplug.spotless') {
    spotless {
        java {
            forbidWildcardImports()
            removeUnusedImports()
            palantirJavaFormat('2.87.0')
        }
    }
}

pluginManager.withPlugin('java') {
    pluginManager.apply 'info.solidsoft.pitest'

    tasks.named('compileJava') {
        options.release = 11
    }

    tasks.named('test') {
        useJUnitPlatform {
            includeTags 'unit'
        }
    }

    tasks.register('integrationTest', Test) {
        useJUnitPlatform {
            includeTags 'integration'
        }
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
    }

    tasks.named('check') {
        dependsOn 'integrationTest'
    }
    tasks.withType(Test).configureEach {
        maxParallelForks = Runtime.runtime.availableProcessors()
        maxHeapSize = '2g'
        jvmArgs '-XX:+HeapDumpOnOutOfMemoryError', '-XX:+CrashOnOutOfMemoryError', '-XX:+EnableDynamicAgentLoading'
    }
}

pluginManager.withPlugin('groovy') {
    pluginManager.apply 'codenarc'
    codenarc {
        // Gradle offers no classpath option for a CodeNarc ruleset: CodeNarcInvoker passes the
        // ruleset to the Ant task as "file:" + config, so a bare classpath path is impossible.
        // CodeNarc's own RuleSetUtil does resolve nested ruleset() references from the classpath,
        // so this stub is the whole indirection - the composition lives in the jar on the codenarc
        // configuration, and no repository-relative path appears here.
        //
        // The nesting is required: RuleSetBuilder exposes only ruleset(Closure) at the top level,
        // and ruleset(String) is a method on the closure's delegate.
        //
        // A text resource from a string materialises without an .xml or .json extension, and
        // RuleSetUtil falls through to GroovyDslRuleSet for exactly that case, which is the dialect
        // this stub is written in.
        config = resources.text.fromString("ruleset { ruleset('rulesets/groovy/joke-strict.groovy') }")
        maxPriority1Violations = 0
        maxPriority2Violations = 0
        maxPriority3Violations = 0
    }
    dependencies {
        codenarc 'org.codenarc:CodeNarc:4.0.0'
    }
    tasks.withType(CodeNarc).configureEach {
        reports {
            xml.required = false
            html.required = true
            text.required = true
        }
    }
}

pluginManager.withPlugin('info.solidsoft.pitest') {
    pitest {
        outputFormats = ['XML', 'HTML']
        pitestVersion = '1.25.8'
        junit5PluginVersion = '1.2.3'
        mutators = ['ALL']
        enableDefaultIncrementalAnalysis = true
        includedGroups = ['unit']
        timestampedReports = false
        threads = Runtime.runtime.availableProcessors()
        jvmArgs = ['-XX:+EnableDynamicAgentLoading']
        failWhenNoMutations = true
        mutationThreshold = 100
        coverageThreshold = 100
        testStrengthThreshold = 100
    }
    dependencies {
        pitest 'org.pitest:pitest-history-plugin:0.0.1'
        compileOnly 'com.groupcdg:pitest-annotations:1.1.4'
    }
    tasks.named('check') { dependsOn 'pitest' }
}

pluginManager.withPlugin('pmd') {
    pmd {
        consoleOutput = false
        rulesMinimumPriority = 5
        ruleSets = ['rulesets/java/joke-strict.xml']
        dependencies {
            pmd 'net.sourceforge.pmd:pmd-dist:7.26.0'
        }
    }
}

pluginManager.withPlugin('net.ltgt.errorprone') {
    pluginManager.apply 'net.ltgt.nullaway'
    dependencies {
        errorprone('com.google.errorprone:error_prone_core:2.49.0')
    }
    tasks.withType(JavaCompile).configureEach {
        options.errorprone {
            disableWarningsInGeneratedCode = true
        }
    }
}

pluginManager.withPlugin('net.ltgt.nullaway') {
    dependencies {
        errorprone('com.uber.nullaway:nullaway:0.13.4')
    }
    tasks.withType(JavaCompile).configureEach {
        options.errorprone {
            error('RequireExplicitNullMarking')
            nullaway {
                error()
                onlyNullMarked = true
                treatGeneratedAsUnannotated = true
                jspecifyMode = true
                suggestSuppressions = true
                checkContracts = true
                acknowledgeRestrictiveAnnotations = true
            }
        }
    }
}

pluginManager.withPlugin('maven-publish') {
    pluginManager.apply 'io.github.sgtsilvio.gradle.metadata'
    pluginManager.apply 'signing'
}

pluginManager.withPlugin('io.github.sgtsilvio.gradle.metadata') {
    metadata {
        readableName = project.name
        license { apache2() }
        developers {
            register('joke') {
                fullName = 'Joke de Buhr'
                email = 'joke@xckk.de'
            }
        }
        github {
            org = 'joke'
            repo = rootProject.name
            issues()
        }
    }
}

pluginManager.withPlugin('maven-publish') {
    pluginManager.withPlugin('java') {
        java {
            withJavadocJar()
            withSourcesJar()
        }
        publishing {
            publications {
                maven(MavenPublication) {
                    from components.java
                }
            }
        }
    }
    pluginManager.withPlugin('java-platform') {
        publishing {
            publications {
                maven(MavenPublication) {
                    from components.javaPlatform
                }
            }
        }
    }
}

pluginManager.withPlugin('signing') {
    signing {
        useGpgCmd()
    }
    pluginManager.withPlugin('maven-publish') {
        // Every publication, not just `maven`. A module may add another - a relocation POM at a
        // retired coordinate, say - and an unsigned artifact is rejected by the Central Portal at
        // the one moment it cannot be withdrawn.
        publishing.publications.configureEach { signing.sign(it) }
    }
}
