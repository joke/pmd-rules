plugins {
    id 'java-platform'
    id 'conventions'
}

javaPlatform {
    allowDependencies()
}

dependencies {

    api platform('org.junit:junit-bom:6.1.2')

    constraints {
        api 'org.assertj:assertj-core:3.27.7'
        api 'org.jspecify:jspecify:1.0.0'
        api 'io.github.joke.jspecify:processor:1.0.0'
        api 'org.jetbrains:annotations:26.1.0'
        api 'org.mockito:mockito-core:5.23.0'
        api 'org.projectlombok:lombok:1.18.46'

        // The supported PMD floor. Rules compiled against the floor run on newer PMD; the reverse
        // throws NoSuchMethodError inside the consumer's analysis. Raising this is a decision to be
        // recorded in a change, never a side effect of a dependency update.
        api 'net.sourceforge.pmd:pmd-core:7.26.0'
        api 'net.sourceforge.pmd:pmd-java:7.26.0'
        api 'net.sourceforge.pmd:pmd-test:7.26.0'

        // The supported CodeNarc floor, on the Groovy 5 line. Same reasoning as the PMD floor:
        // rules compiled against the floor run on newer CodeNarc, not the reverse. Raising this is
        // a decision to be recorded in a change, never a side effect of a dependency update.
        //
        // 4.0.0 is both the floor and the oldest CodeNarc on this line - the Groovy 5 line begins
        // there, and the artifact suffix that marked the Groovy 3 and Groovy 4 lines is dropped.
        //
        // Groovy is declared alongside it because CodeNarc's POM puts every Groovy module at
        // runtime scope, so CodeNarc alone does not put org.codehaus.groovy.ast.* on the compile
        // classpath and a Java rule extending AbstractAstVisitor will not compile.
        //
        // These three move together. CodeNarc parses .groovy source with its own embedded Groovy,
        // so a specification written in syntax newer than the analysing CodeNarc's parser fails
        // analysis while compiling perfectly.
        api 'org.codenarc:CodeNarc:4.0.0'
        api 'org.apache.groovy:groovy:5.0.8'
        api 'org.spockframework:spock-core:2.4-groovy-5.0'
    }

}
